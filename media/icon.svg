<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Git Code Reviewer logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#g)"/>

  <!-- stylized "CR" monogram built from simple geometry -->
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- C -->
    <path d="M56 40c-10 0-18 8-18 18v12c0 10 8 18 18 18"/>
    <!-- R stem -->
    <path d="M72 40v48"/>
    <!-- R bowl -->
    <path d="M72 40h10c8 0 14 6 14 14s-6 14-14 14H72"/>
    <!-- R leg -->
    <path d="M82 68l18 20"/>
  </g>

  <!-- subtle "diff" ticks -->
  <g stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round">
    <path d="M30 92h18"/>
    <path d="M30 102h12"/>
  </g>
</svg>
